<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CRM MVP - Etapa 1</title>
  <style>
    body { font-family: monospace, sans-serif; margin: 20px; background: #f4f4f4; color: #111; }
    .hidden { display: none !important; }
    .box { background: #fff; border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
    input, button { padding: 6px 10px; margin: 4px 0; font-family: inherit; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
    th, td { border: 1px solid #999; padding: 8px; text-align: left; }
    th { background: #eee; }
    .msg-error { color: #b00020; font-weight: bold; margin: 8px 0; }
    .msg-success { color: #006400; font-weight: bold; margin: 8px 0; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN (US01) -->
  <div id="login-view" class="box" style="max-width: 400px; margin: 60px auto;">
    <h2>Login CRM (US01)</h2>
    <p><small>Demo: <b>admin@crm.com</b> | Senha: <b>123456</b></small></p>
    <div id="login-error" class="msg-error"></div>
    <form id="login-form">
      <div>
        <label>E-mail:</label><br>
        <input type="email" id="login-email" required style="width: 95%;" value="admin@crm.com">
      </div>
      <div>
        <label>Senha:</label><br>
        <input type="password" id="login-password" required style="width: 95%;" value="123456">
      </div>
      <br>
      <button type="submit" id="btn-login">Entrar</button>
    </form>
  </div>

  <!-- PAINEL PRINCIPAL (US02) -->
  <div id="app-view" class="hidden">
    <div class="header-bar">
      <div>
        <strong>CRM MVP - Gestão de Carteira</strong> | Logado como: <span id="user-name"></span>
      </div>
      <button onclick="logout()">Sair (Logout)</button>
    </div>

    <!-- FORMULÁRIO DE CADASTRO DE CLIENTE (US02) -->
    <div class="box">
      <h3>Novo Cliente / Lead (US02)</h3>
      <div id="customer-feedback"></div>
      <form id="customer-form">
        <input type="text" id="cust-name" placeholder="Nome *" required>
        <input type="email" id="cust-email" placeholder="E-mail *" required>
        <input type="text" id="cust-phone" placeholder="Telefone *" required>
        <input type="text" id="cust-company" placeholder="Empresa (Opcional)">
        <input type="text" id="cust-role" placeholder="Cargo (Opcional)">
        <button type="submit" id="btn-save-cust">Salvar Cliente</button>
      </form>
    </div>

    <!-- LISTAGEM DE CLIENTES (US02) -->
    <div class="box">
      <h3>Base de Clientes / Leads</h3>
      <div id="loading-customers" class="hidden">Carregando clientes...</div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Empresa / Cargo</th>
            <th>Status (RN03)</th>
            <th>Data Cadastro</th>
          </tr>
        </thead>
        <tbody id="customers-tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    // Controle de Rotas / Sessão (RN03 US01)
    function checkAuth() {
      const token = localStorage.getItem('crm_token');
      const user = JSON.parse(localStorage.getItem('crm_user') || 'null');

      if (!token || !user) {
        document.getElementById('login-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
      } else {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('app-view').classList.remove('hidden');
        document.getElementById('user-name').textContent = `${user.name} (${user.email})`;
        loadCustomers();
      }
    }

    function logout() {
      localStorage.removeItem('crm_token');
      localStorage.removeItem('crm_user');
      checkAuth();
    }

    // Submissão de Login (US01)
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      errorDiv.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Autenticando...';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Erro ao realizar login';
        } else {
          localStorage.setItem('crm_token', data.token);
          localStorage.setItem('crm_user', JSON.stringify(data.user));
          checkAuth();
        }
      } catch (err) {
        errorDiv.textContent = 'Erro de conexão com o servidor.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    // Listagem de Clientes (US02)
    async function loadCustomers() {
      const token = localStorage.getItem('crm_token');
      const tbody = document.getElementById('customers-tbody');
      const loading = document.getElementById('loading-customers');

      loading.classList.remove('hidden');
      tbody.innerHTML = '';

      try {
        const res = await fetch(`${API_URL}/customers`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) return logout();

        const customers = await res.json();
        if (customers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7">Nenhum cliente cadastrado ainda.</td></tr>';
          return;
        }

        customers.forEach(c => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${c.id}</td>
            <td><strong>${c.name}</strong></td>
            <td>${c.email}</td>
            <td>${c.phone}</td>
            <td>${c.company || '-'} ${c.role ? `(${c.role})` : ''}</td>
            <td><b>${c.status}</b></td>
            <td>${new Date(c.created_at).toLocaleString('pt-BR')}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" class="msg-error">Erro ao carregar lista.</td></tr>';
      } finally {
        loading.classList.add('hidden');
      }
    }

    // Cadastro de Clientes (US02)
    document.getElementById('customer-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = localStorage.getItem('crm_token');
      const feedback = document.getElementById('customer-feedback');
      const btn = document.getElementById('btn-save-cust');

      const payload = {
        name: document.getElementById('cust-name').value.trim(),
        email: document.getElementById('cust-email').value.trim(),
        phone: document.getElementById('cust-phone').value.trim(),
        company: document.getElementById('cust-company').value.trim(),
        role: document.getElementById('cust-role').value.trim(),
      };

      feedback.textContent = '';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/customers`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          feedback.className = 'msg-error';
          feedback.textContent = `Erro (${res.status}): ${data.error}`;
        } else {
          feedback.className = 'msg-success';
          feedback.textContent = 'Cliente cadastrado com sucesso (Status 201)!';
          document.getElementById('customer-form').reset();
          loadCustomers();
        }
      } catch (err) {
        feedback.className = 'msg-error';
        feedback.textContent = 'Falha na comunicação com a API.';
      } finally {
        btn.disabled = false;
      }
    });

    // Inicializar verificação de sessão ao abrir a página
    checkAuth();
  </script>
</body>
</html>
